name: Daily department digest email

on:
  schedule:
    # 09:00 IST = 03:30 UTC
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      test_to:
        description: Optional test email (work inbox). Leave blank to use recipients.json only.
        required: false
        type: string

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send daily + weekly digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          DIGEST_TEST_TO: ${{ github.event.inputs.test_to }}
        run: npm run digest:email
