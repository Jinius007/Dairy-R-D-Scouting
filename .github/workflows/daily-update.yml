name: Daily R&D Ingestion

on:
  schedule:
    # 15:00 IST = 09:30 UTC, so data is ready before the 16:00 IST Chrome pop
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily ingestion
        run: npm run ingest

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/developments.json
          if git diff --staged --quiet; then
            echo "No new developments found"
          else
            git commit -m "chore: daily R&D ingestion $(date +%Y-%m-%d)"
            git push
          fi
